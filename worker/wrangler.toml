# Portfolio API Worker — serves /api/chat, /api/contact and /api/health.
# Local:  npm run worker:dev   (reads secrets from worker/.dev.vars)
# Deploy: npm run worker:deploy
name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Serve the API on the same domain as the Pages site so the browser calls
# /api/* same-origin (no CORS). Uncomment once the domain is on Cloudflare:
# routes = [{ pattern = "paulsunnydev.com/api/*", zone_name = "paulsunnydev.com" }]

[vars]
# Origins allowed to call the API cross-origin (e.g. a *.pages.dev preview
# calling the *.workers.dev URL). Same-origin requests don't need an entry.
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:4173"
# Resend sender + inbox for contact emails (only used when RESEND_API_KEY is set).
CONTACT_TO_EMAIL = "paulsunnyisogon@gmail.com"
CONTACT_FROM_EMAIL = ""

# Secrets — set with `npx wrangler secret put <NAME> --config worker/wrangler.toml`:
#   TYPESAFE_API_KEY     required for /api/chat
#   CONTACT_WEBHOOK_URL  optional: n8n / GHL / Zapier / Make webhook for contact posts
#   RESEND_API_KEY       optional: email delivery via Resend

# Cloudflare Rate Limiting (per client IP). period must be 10 or 60 seconds.
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
