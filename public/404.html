<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | paulsunnydev</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #101012;
    --ink: #f5f5f7;
    --sub: #86868b;
    --accent: #00d4ff;
    --line: rgba(255, 255, 255, 0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 24px;
    padding: 56px 48px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    text-align: center;
  }
  .kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--sub);
  }
  h1 {
    margin-top: 12px;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  h1 .accent { color: var(--accent); }
  p {
    margin-top: 16px;
    font-size: 17px;
    line-height: 1.6;
    color: var(--sub);
  }
  .actions {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 28px;
    border-radius: 980px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  a.btn-primary {
    background: var(--accent);
    color: #0a0a0a;
  }
  a.btn-primary:hover {
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.25);
  }
  a.btn-secondary {
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: var(--ink);
  }
  a.btn-secondary:hover {
    background: var(--ink);
    color: #0a0a0a;
    border-color: var(--ink);
  }
</style>
</head>
<body>
  <main>
    <p class="kicker">404</p>
    <h1>This page got <span class="accent">washed away</span></h1>
    <p>The link is broken or the page moved. Let's get you back to dry land.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/my-360-animation/">Back to homepage</a>
      <a class="btn btn-secondary" href="/my-360-animation/#contact">Get in touch</a>
    </div>
  </main>
</body>
</html>
