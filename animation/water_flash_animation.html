<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Splash Header — Demo</title>
<link rel="stylesheet" href="splash.css">
<style>
  /* demo-only styles (not part of the splash) */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0e1015;
    color: #e8ecf4;
    min-height: 200vh;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em;
    color: #e8ecf4; text-decoration: none;
  }
  .logo svg { width: 28px; height: 28px; }
  nav { display: flex; gap: 28px; align-items: center; }
  nav a { color: #8b94a7; text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: color 0.2s; }
  nav a:hover { color: #e8ecf4; }
  .cta-btn {
    background: #38bdf8; color: #0b0e14; padding: 8px 18px; border-radius: 6px;
    font-weight: 600; font-size: 0.85rem; text-decoration: none; transition: background 0.2s;
  }
  .cta-btn:hover { background: #7dd3fc; }
  .hero { max-width: 800px; margin: 0 auto; padding: 120px 24px; text-align: center; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 20px; }
  .hero p { color: #8b94a7; font-size: 1.1rem; line-height: 1.7; }
</style>
</head>
<body>

<header class="site-header">
  <canvas id="splashCanvas"></canvas>
  <div class="header-content">
    <a class="logo" href="#">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0C19 10.5 12 2 12 2Z" fill="#38bdf8"/>
        <path d="M9 15a3 3 0 0 0 3 3" stroke="#0b0e14" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      HydraFlow
    </a>
    <nav>
      <a href="#">Products</a>
      <a href="#">Solutions</a>
      <a href="#">Pricing</a>
      <a href="#">Docs</a>
      <a class="cta-btn" href="#">Get started</a>
    </nav>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Deploy at the speed<br>of pressure.</h1>
    <p>Scroll down — the water splash stays contained in the header above.</p>
  </div>
</main>

<script src="splash.js" defer></script>
</body>
</html>
